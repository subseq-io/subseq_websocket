[package]
name = "subseq_websocket"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8", features = ["ws"] }
bytes = { version = "1.10.1" }
chrono = { version = "0.4.43", optional = true, features = ["serde"] }
futures-util = { version = "0.3.31" }
once_cell = { version = "1.21.3", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", optional = true, features = ["postgres", "runtime-tokio-rustls", "macros", "uuid", "chrono", "json"] }
subseq_auth = { git = "https://github.com/subseq-io/subseq_auth.git", branch = "main" }
subseq_util = { git = "https://github.com/subseq-io/subseq_util.git", branch = "main" }
tokio = { version = "1.49.0", features = ["sync", "rt"] }
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[features]
default = ["sqlx"]
sqlx = ["dep:sqlx", "dep:once_cell", "dep:chrono"]

[dev-dependencies]
axum-server = "0.7.2"
serde_urlencoded = "0.7.1"
tracing-subscriber = "0.3.20"
